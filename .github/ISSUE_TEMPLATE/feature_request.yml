name: 🚀 功能请求
description: 建议新功能或改进现有功能
title: "[Feature] "
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请描述清楚你的需求和使用场景。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，确认该功能未被建议过
          required: true
        - label: 我已确认该功能不在已规划的 [Roadmap](https://github.com/users/Neutriny/projects/4/views/3) 中
          required: false

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰简洁地描述你希望添加的功能
      placeholder: 例如：希望支持为每个实例单独设置 Java 参数
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 使用场景
      description: 描述你遇到什么问题，这个功能能解决什么痛点
      placeholder: |
        例如：我需要在不同实例中使用不同版本的 Java（Fabric 1.20 用 Java 17，NeoForge 1.21 用 Java 21），
        现在每次切换实例都要去设置里改全局 Java，很麻烦。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议的实现方案
      description: 如果你对接口或交互有具体想法，请描述
      placeholder: |
        例如：在实例设置的"启动配置"标签页中增加一个"自定义 Java 路径"选项，
        留空则使用全局设置。

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他解决方式？
      placeholder: 例如：目前通过手动编辑启动脚本实现，但对普通用户不友好

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - UI/前端
        - 启动流程
        - 账户系统
        - 实例/游戏目录管理
        - 资源下载
        - 扩展系统
        - 其他
    validations:
      required: false
