[package]
name = "amethyst-launcher"
version = "0.1.0"
description = "A Tauri App"
authors = ["Neutriny"]
edition = "2024"

[lib]
# `_lib` 后缀看似多余，但为了避免与二进制文件名冲突，必须保留。
# 这似乎是 Windows 特有的问题，参见 https://github.com/rust-lang/cargo/issues/8519
name = "amethyst_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

